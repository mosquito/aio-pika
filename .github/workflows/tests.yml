name: tests


on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]


jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup python3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check
        env:
          FORCE_COLOR: 1
      - run: uv run ruff format --check
        env:
          FORCE_COLOR: 1
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup python3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run mypy
        env:
          FORCE_COLOR: 1

  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.loop }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - python: '3.11'
            loop: uvloop
          - python: '3.12'
            loop: uvloop
          - python: '3.13'
            loop: uvloop
          # uvloop wheels for free-threaded builds start at Python 3.14.
          - python: '3.13t'
            loop: asyncio
          - python: '3.14'
            loop: uvloop
          - python: '3.14t'
            loop: uvloop
          - python: '3.15'
            loop: uvloop
          - python: '3.15t'
            loop: uvloop
    steps:
      - uses: actions/checkout@v6
      - name: Setup python${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v5
      - run: >-
          uv sync --locked --no-default-groups
          --group test --group ${{ matrix.loop }}
      - name: Verify test environment
        env:
          TEST_LOOP: ${{ matrix.loop }}
          FREE_THREADED: ${{ endsWith(matrix.python, 't') && '1' || '0' }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import sys
          import sysconfig

          import aiomisc_pytest
          import aio_pika

          if os.environ["TEST_LOOP"] == "uvloop":
              import uvloop

          free_threaded = os.environ["FREE_THREADED"] == "1"
          assert bool(sysconfig.get_config_var("Py_GIL_DISABLED")) == free_threaded
          if free_threaded:
              assert not sys._is_gil_enabled()
          PY
      - name: pytest
        run: >-
          uv run --no-sync pytest \
            -vv \
            --cov=aio_pika \
            --cov-report=term-missing \
            --doctest-modules \
            --aiomisc-test-timeout=120 \
            tests
        env:
          FORCE_COLOR: 1
      - run: uv run --no-sync coveralls
        env:
          COVERALLS_PARALLEL: 'true'
          COVERALLS_SERVICE_NAME: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish:
    needs:
       - tests
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
